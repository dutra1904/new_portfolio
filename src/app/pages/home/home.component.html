<div class="nav-wrap">
  <header class="site-nav">
    <a href="#home" class="logo" (click)="scrollTo('home', $event)">Maria Dutra</a>

    <nav class="site-nav-links" [attr.aria-label]="lang === 'PT' ? 'Seções' : 'Sections'">
      <button
        *ngFor="let item of navItems"
        type="button"
        [class.active]="activeSection === item.id"
        (click)="scrollTo(item.id)">
        {{ copy.nav[item.key] }}
      </button>
    </nav>

    <div class="site-nav-end">
      <a class="skip" href="#projects" (click)="scrollTo('projects', $event)">{{ copy.nav.skip }}</a>
      <span class="status-badge">
        <span class="status-dot"></span>
        {{ copy.nav.available }}
      </span>
      <select class="language-selector" [value]="lang" (change)="setLanguage($event)" [attr.aria-label]="copy.nav.language">
        <option value="EN">EN</option>
        <option value="PT">PT</option>
      </select>
    </div>
  </header>
</div>

<section id="home" class="hero" aria-labelledby="hero-title">
  <div class="shell hero-inner">
    <div class="hero-copy">
      <ul class="badges" [attr.aria-label]="lang === 'PT' ? 'Destaques' : 'Highlights'">
        <li *ngFor="let badge of copy.hero.badges">{{ badge }}</li>
      </ul>
      <h1 id="hero-title">
        {{ copy.hero.titleName }}
        <span class="h1-role"><span class="dash">— </span>{{ copy.hero.titleRole }}</span>
      </h1>
      <p class="lede">{{ copy.hero.tagline }}</p>
      <div class="hero-actions">
        <button type="button" class="btn-primary" (click)="scrollTo('projects')">{{ copy.hero.primaryCta }}</button>
        <a class="btn-ghost" [href]="cv.href" [download]="cv.filename">{{ copy.hero.secondaryCta }}</a>
      </div>
      <app-social-links [links]="copy.social"></app-social-links>
      <ul class="stack-line" [attr.aria-label]="copy.hero.stackLabel">
        <li *ngFor="let item of copy.hero.stack">{{ item }}</li>
      </ul>
    </div>
    <div class="hero-media">
      <img
        src="assets/img/me-hero.jpg"
        [alt]="copy.hero.photoAlt"
        width="480"
        height="600"
        fetchpriority="high"
        decoding="async">
    </div>
  </div>
</section>

<section id="projects" class="band" aria-labelledby="projects-title">
  <div class="shell">
    <app-portfolio [copy]="copy.projects"></app-portfolio>
  </div>
</section>

<section id="ecosystem" class="band" aria-labelledby="ecosystem-title">
  <div class="shell">
    <app-ecosystem [copy]="copy.ecosystem"></app-ecosystem>
  </div>
</section>

<section id="experience" class="band" aria-labelledby="experience-title">
  <div class="shell">
    <app-resume [copy]="copy.experience" [cvHref]="cv.href" [cvFilename]="cv.filename"></app-resume>
  </div>
</section>

<section id="about" class="band" aria-labelledby="about-title">
  <div class="shell">
    <app-about-me [copy]="copy.about"></app-about-me>
  </div>
</section>

<section id="contact" class="band" aria-labelledby="contact-title">
  <div class="shell contact-shell">
    <app-contact [copy]="copy.contact"></app-contact>
  </div>
</section>

<footer role="contentinfo">
  <p>© {{ year }} Maria Clara Dutra · {{ copy.footer }}</p>
</footer>
