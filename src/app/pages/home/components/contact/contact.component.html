<div class="tab-content">
  <div class="title-tabs-wrapper">
    <h2 class="tab-title">{{ translations?.contact?.title }}</h2>
    <div class="tabs-navigation-content">
      <button class="tab-button-content" [class.active]="isActiveTab('about')" (click)="setActiveTab('about')">{{ translations?.header?.about }}</button>
      <button class="tab-button-content" [class.active]="isActiveTab('portfolio')" (click)="setActiveTab('portfolio')">{{ translations?.header?.portfolio }}</button>
      <button class="tab-button-content" [class.active]="isActiveTab('resume')" (click)="setActiveTab('resume')">{{ translations?.header?.resume }}</button>
      <button class="tab-button-content" [class.active]="isActiveTab('contact')" (click)="setActiveTab('contact')">{{ translations?.header?.contact }}</button>
    </div>
  </div>

  <p class="contact-lead">{{ translations?.contact?.openTo }}</p>

  <form (ngSubmit)="enviarMensagem($event)" [attr.aria-label]="translations?.contact?.title" class="contact-form" novalidate>
    <input
      class="hp"
      type="text"
      name="website"
      tabindex="-1"
      autocomplete="off"
      [(ngModel)]="honeypot"
      aria-hidden="true">

    <div class="form-row-inputs">
      <div class="field">
        <label for="nome">{{ translations?.contact?.name }}</label>
        <input type="text" id="nome" name="name" [(ngModel)]="nome" [placeholder]="translations?.contact?.name" required [disabled]="status === 'sending'">
      </div>
      <div class="field">
        <label for="email">{{ translations?.contact?.email }}</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" [placeholder]="translations?.contact?.email" required [disabled]="status === 'sending'">
      </div>
    </div>

    <div class="field">
      <label for="mensagem">{{ translations?.contact?.message }}</label>
      <textarea id="mensagem" name="message" [(ngModel)]="mensagem" [placeholder]="translations?.contact?.message" required [disabled]="status === 'sending'"></textarea>
    </div>

    <button type="submit" class="send-btn" [disabled]="status === 'sending' || status === 'sent'">
      {{ status === 'sending' ? translations?.contact?.sending : translations?.contact?.send }}
    </button>

    <p class="form-status" [class.ok]="status === 'sent'" [class.err]="status === 'error'" *ngIf="statusMessage">
      {{ statusMessage }}
    </p>
  </form>
</div>
