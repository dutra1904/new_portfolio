<div class="section-head">
  <p class="kicker">{{ copy.kicker }}</p>
  <h2 id="contact-title">{{ copy.title }}</h2>
  <p>{{ copy.lead }}</p>
</div>

<p class="direct-mail">
  <span>{{ copy.emailLabel }}</span>
  <a href="mailto:dutramaria165@gmail.com">dutramaria165&#64;gmail.com</a>
</p>

<form (ngSubmit)="enviarMensagem($event)" [attr.aria-label]="copy.title" class="contact-form" novalidate>
  <input
    class="hp"
    type="text"
    name="website"
    tabindex="-1"
    autocomplete="off"
    [(ngModel)]="honeypot"
    aria-hidden="true">

  <div class="form-row-inputs">
    <div class="field">
      <label for="nome">{{ copy.name }}</label>
      <input type="text" id="nome" name="name" [(ngModel)]="nome" [placeholder]="copy.name" required autocomplete="name" [disabled]="status === 'sending'">
    </div>
    <div class="field">
      <label for="email">{{ copy.email }}</label>
      <input type="email" id="email" name="email" [(ngModel)]="email" [placeholder]="copy.email" required autocomplete="email" [disabled]="status === 'sending'">
    </div>
  </div>

  <div class="field">
    <label for="mensagem">{{ copy.message }}</label>
    <textarea id="mensagem" name="message" [(ngModel)]="mensagem" [placeholder]="copy.message" required [disabled]="status === 'sending'"></textarea>
  </div>

  <button type="submit" class="send-btn" [disabled]="status === 'sending' || status === 'sent'">
    {{ status === 'sending' ? copy.sending : copy.send }}
  </button>

  <p class="form-status" [class.ok]="status === 'sent'" [class.err]="status === 'error'" *ngIf="statusMessage" role="status">
    {{ statusMessage }}
  </p>
</form>
