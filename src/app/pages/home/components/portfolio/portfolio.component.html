<div class="tab-content">
  <div class="title-tabs-wrapper">
    <h2 class="tab-title" id="projetos-titulo">{{ translations?.projects?.title }}</h2>
    <div class="tabs-navigation-content">
      <button *ngFor="let tab of tabs; trackBy: trackByTabId"
        class="tab-button-content"
        [class.active]="isActiveTab(tab.id)"
        (click)="setActiveTab(tab.id)">
        {{ translations?.header?.[tab.key] }}
      </button>
    </div>
  </div>

  <div class="work-grid">
    <article class="work-card" *ngFor="let projeto of projetos; trackBy: trackByTitle">
      <button type="button" class="work-card-hit" (click)="abrirProjeto(projeto.link)" [attr.aria-label]="projeto.titulo">
        <div class="work-thumb" [style.background-image]="'url(' + projeto.imagem + ')'"></div>
        <div class="work-body">
          <div class="work-head">
            <h3>{{ projeto.titulo }}</h3>
            <span class="work-open" aria-hidden="true">↗</span>
          </div>
          <p>{{ projeto.descricao }}</p>
          <ul class="work-stack" *ngIf="projeto.stack?.length">
            <li *ngFor="let tech of projeto.stack">{{ tech }}</li>
          </ul>
        </div>
      </button>
    </article>
  </div>
</div>
