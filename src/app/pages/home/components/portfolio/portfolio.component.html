<div class="section-head">
  <p class="kicker">{{ copy.kicker }}</p>
  <h2 id="projects-title">{{ copy.title }}</h2>
  <p>{{ copy.lead }}</p>
</div>

<div class="project-grid">
  <article class="project-card hover-card" *ngFor="let project of copy.items; trackBy: trackById">
    <div class="project-media">
      <img [src]="project.image" [alt]="project.imageAlt" width="640" height="400" loading="lazy" decoding="async">
    </div>
    <div class="project-body">
      <h3>{{ project.title }}</h3>
      <dl class="story">
        <div>
          <dt>{{ copy.problem }}</dt>
          <dd>{{ project.problem }}</dd>
        </div>
        <div>
          <dt>{{ copy.solution }}</dt>
          <dd>{{ project.solution }}</dd>
        </div>
        <div>
          <dt>{{ copy.impact }}</dt>
          <dd>{{ project.impact }}</dd>
        </div>
      </dl>
      <p class="project-note" *ngIf="project.note">{{ project.note }}</p>
      <ul class="tags">
        <li *ngFor="let tag of project.tags">{{ tag }}</li>
      </ul>
      <div class="project-links">
        <a *ngFor="let link of project.links" [href]="link.href" target="_blank" rel="noopener noreferrer">
          {{ link.label }} <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>
  </article>
</div>
