<div class="section-head">
  <p class="kicker">{{ copy.kicker }}</p>
  <h2 id="experience-title">{{ copy.title }}</h2>
  <p>{{ copy.lead }}</p>
</div>

<ol class="timeline">
  <li *ngFor="let item of copy.items; trackBy: trackByOrg">
    <div class="timeline-meta">
      <p class="period">{{ item.period }}</p>
    </div>
    <div class="timeline-body hover-card">
      <h3>{{ item.org }}</h3>
      <p class="role">{{ item.role }}</p>
      <p>{{ item.summary }}</p>
      <ul *ngIf="item.points as points">
        <li *ngFor="let point of points">{{ point }}</li>
      </ul>
    </div>
  </li>
</ol>

<div class="experience-footer">
  <p>{{ copy.education }}</p>
  <a class="btn-primary" [href]="cvHref" [download]="cvFilename">{{ copy.download }}</a>
</div>
