<div class="section-head">
  <p class="kicker">{{ copy.kicker }}</p>
  <h2 id="about-title">{{ copy.title }}</h2>
</div>

<div class="about-layout">
  <div class="about-copy">
    <p *ngFor="let paragraph of copy.paragraphs">{{ paragraph }}</p>
  </div>
  <div class="skill-groups">
    <article class="skill-group hover-card" *ngFor="let group of copy.groups; trackBy: trackByTitle">
      <h3>{{ group.title }}</h3>
      <ul>
        <li *ngFor="let item of group.items">{{ item }}</li>
      </ul>
    </article>
  </div>
</div>
